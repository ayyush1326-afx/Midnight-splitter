name: CI — Midnight Splitter

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Frontend & ZK Circuit Tests ────────────────────────────────────
  frontend-ci:
    name: Frontend & ZK Circuits (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20.x']

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔧 TypeScript type-check
        run: npx tsc --noEmit

      - name: 🧪 Run Vitest unit tests (Midnight Contract & ZK Circuits)
        run: npm test

      - name: 🏗️ Production build
        run: npm run build

  # ── Job 2: Midnight Compact Contract Validation ─────────────────────────────
  compact-contract-ci:
    name: Midnight Compact Contract (.compact)
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🔍 Validate Compact DSL contract existence & structure
        run: |
          if [ ! -f "contracts/midnight_splitter.compact" ]; then
            echo "❌ Compact smart contract missing: contracts/midnight_splitter.compact"
            exit 1
          fi
          echo "✅ Compact contract found: contracts/midnight_splitter.compact"

      - name: ⚙️ Validate Midnight CLI configuration
        run: |
          if [ ! -f "contracts/midnight-cli.json" ]; then
            echo "❌ Midnight CLI config missing: contracts/midnight-cli.json"
            exit 1
          fi
          echo "✅ Midnight CLI config valid: contracts/midnight-cli.json"

  # ── Job 3: Summary ─────────────────────────────────────────────────────────
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [frontend-ci, compact-contract-ci]
    if: always()

    steps:
      - name: ✅ Verify all CI checks passed
        run: |
          echo "Frontend CI:  ${{ needs.frontend-ci.result }}"
          echo "Compact CI:   ${{ needs.compact-contract-ci.result }}"
          if [[ "${{ needs.frontend-ci.result }}" != "success" ]] || \
             [[ "${{ needs.compact-contract-ci.result }}" != "success" ]]; then
            echo "❌ One or more CI jobs failed"
            exit 1
          fi
          echo "✅ All CI jobs passed successfully"
