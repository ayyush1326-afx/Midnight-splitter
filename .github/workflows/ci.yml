name: CI — Midnight Splitter

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Frontend Build & Tests ──────────────────────────────────────────
  frontend-ci:
    name: Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20.x']

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔧 TypeScript type-check
        run: npx tsc --noEmit

      - name: 🧪 Run Vitest unit tests
        run: npm test

      - name: 🏗️ Production build
        run: npm run build

  # ── Job 2: Soroban Smart Contract Tests ───────────────────────────────────
  contract-ci:
    name: Soroban Contract (Rust)
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🦀 Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: 🔬 Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/midnight_splitter/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/midnight_splitter/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: 🧪 Run Soroban contract unit tests
        working-directory: contracts/midnight_splitter
        run: cargo test --lib -- --test-threads=1

      - name: 🔬 Lint (clippy)
        working-directory: contracts/midnight_splitter
        run: cargo clippy --lib -- -D warnings
        continue-on-error: true

  # ── Job 3: Summary ─────────────────────────────────────────────────────────
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [frontend-ci, contract-ci]
    if: always()

    steps:
      - name: ✅ All CI checks passed
        run: |
          echo "Frontend CI:  ${{ needs.frontend-ci.result }}"
          echo "Contract CI:  ${{ needs.contract-ci.result }}"
          if [[ "${{ needs.frontend-ci.result }}" != "success" ]] || \
             [[ "${{ needs.contract-ci.result }}" != "success" ]]; then
            echo "❌ One or more CI jobs failed"
            exit 1
          fi
          echo "✅ All CI jobs passed"
